<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Yönetim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status-badge.offline {
            background: #ef4444;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-badge.offline .status-dot {
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .control-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .control-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .control-btn {
            padding: 18px 25px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-restart {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .bot-embed {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .bot-embed h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .discord-widget {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 10px;
            background: #36393f;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            animation: slideIn 0.3s;
            z-index: 1000;
        }

        .alert.active {
            display: block;
        }

        .alert-success {
            background: #10b981;
            color: white;
        }

        .alert-error {
            background: #ef4444;
            color: white;
        }

        .alert-info {
            background: #3b82f6;
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }

            .alert {
                right: 10px;
                left: 10px;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Alert -->
        <div id="alert" class="alert"></div>

        <!-- Header -->
        <div class="header">
            <h1>🤖 Discord Ticket Bot</h1>
            <p style="color: #666; font-size: 16px;">Bot Yönetim Paneli</p>
            <div class="status-badge" id="statusBadge">
                <div class="status-dot"></div>
                <span id="statusText">Bot Aktif</span>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2>⚙️ Bot Kontrolü</h2>
            <div class="button-grid">
                <button class="control-btn btn-start" onclick="startBot()">
                    🚀 Botu Başlat
                </button>
                <button class="control-btn btn-stop" onclick="stopBot()">
                    🛑 Botu Durdur
                </button>
                <button class="control-btn btn-restart" onclick="restartBot()">
                    🔄 Yeniden Başlat
                </button>
            </div>
        </div>

        <!-- Bot Embed -->
        <div class="bot-embed">
            <h2>💬 Discord Widget</h2>
            <iframe 
                class="discord-widget"
                src="https://discord.com/widget?id=1376586048821399716&theme=dark" 
                allowtransparency="true" 
                frameborder="0" 
                sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
            </iframe>
        </div>
    </div>

    <script>
        let botRunning = true;

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} active`;
            alert.textContent = message;
            
            setTimeout(() => {
                alert.classList.remove('active');
            }, 3000);
        }

        function updateStatus(running) {
            botRunning = running;
            const badge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            
            if (running) {
                badge.classList.remove('offline');
                statusText.textContent = 'Bot Aktif';
            } else {
                badge.classList.add('offline');
                statusText.textContent = 'Bot Kapalı';
            }
        }

        function startBot() {
            if (botRunning) {
                showAlert('⚠️ Bot zaten çalışıyor!', 'info');
                return;
            }
            
            showAlert('🚀 Bot başlatılıyor...', 'info');
            
            setTimeout(() => {
                updateStatus(true);
                showAlert('✅ Bot başarıyla başlatıldı!', 'success');
            }, 1500);
        }

        function stopBot() {
            if (!botRunning) {
                showAlert('⚠️ Bot zaten kapalı!', 'info');
                return;
            }

            if (!confirm('Botu durdurmak istediğinize emin misiniz?')) {
                return;
            }
            
            showAlert('🛑 Bot durduruluyor...', 'info');
            
            setTimeout(() => {
                updateStatus(false);
                showAlert('✅ Bot başarıyla durduruldu!', 'success');
            }, 1500);
        }

        function restartBot() {
            showAlert('🔄 Bot yeniden başlatılıyor...', 'info');
            
            setTimeout(() => {
                updateStatus(false);
                
                setTimeout(() => {
                    updateStatus(true);
                    showAlert('✅ Bot başarıyla yeniden başlatıldı!', 'success');
                }, 2000);
            }, 1000);
        }
    </script>
</body>
</html>
